<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * {
            margin: 0;
            padding: 0;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
        }
        #myVideo {
            width: 100vw;
            height: 100vh;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <video id="myVideo" autoplay loop muted playsinline preload="auto">
        <source src="loading.webm" type="video/webm">
        <source src="loading.mp4" type="video/mp4">
    </video>

    <script>
        // Принудительно запускаем видео при загрузке внутри GMod
        document.addEventListener("DOMContentLoaded", function() {
            var video = document.getElementById("myVideo");
            video.muted = true; // Убеждаемся, что звук выключен
            var promise = video.play();
            
            if (promise !== undefined) {
                promise.catch(function(error) {
                    // Если браузер заблокировал запуск, пробуем еще раз через 0.5сек
                    setTimeout(function() {
                        video.play();
                    }, 500);
                });
            }
        });
    </script>
</body>
</html>
